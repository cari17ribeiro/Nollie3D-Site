<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f3e6c9">
  <title>Uma rosa para vocês · Nollie 3D</title>
  <link rel="icon" href="../favicon-32x32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=Nunito:ital,wght@0,400;0,700;0,800;1,400&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      --cream: #f3e6c9;
      --paper: #fbf4e3;
      --edge: #e7d6ac;
      --ink: #241a12;
      --soft: #5a4a37;
      --orange: #e8622c;
      --teal: #1f6f68;
      --mustard: #e3a73b;
      --heading: "Fredoka", "Trebuchet MS", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); font: 1rem/1.5 "Nunito", "Segoe UI", sans-serif; background: var(--cream); }
    .wrap { width: min(58rem, 100% - clamp(2.5rem, 12vw, 10rem)); margin-inline: auto; }
    .mast { background: var(--paper); border-bottom: 2px solid var(--edge); }
    .mast-inner { display: flex; align-items: center; justify-content: space-between; gap: .65rem; padding-block: .85rem; }
    .brand { display: inline-flex; align-items: center; gap: .5rem; font: 700 1.35rem/1 var(--heading); }
    .brand em { color: var(--orange); font-style: normal; }
    .origin { color: var(--soft); font-size: .92rem; font-weight: 700; }
    .scene {
      min-height: calc(100vh - 3.8rem);
      background:
        url("../images/rosas-tinta-laranja.webp") left top / clamp(10rem, 31vw, 32rem) auto no-repeat,
        url("../images/rosas-tinta-verde.webp") right top / clamp(7rem, 15vw, 15rem) auto no-repeat,
        url("../images/rosas-folhas.webp") left bottom / clamp(4rem, 8vw, 8rem) auto no-repeat,
        var(--cream);
      padding: clamp(3rem, 7vw, 5.6rem) 0 2rem;
    }
    .letter {
      display: grid;
      grid-template-columns: minmax(0, .83fr) minmax(0, 1.17fr);
      grid-template-areas: "rose title" "rose verse";
      column-gap: clamp(2rem, 5vw, 4rem);
      padding: clamp(2rem, 4.5vw, 4rem);
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 1.25rem;
      box-shadow: .32rem .42rem 0 #cbb78e;
    }
    .plate {
      grid-area: rose; align-self: center; position: relative; margin: 0;
      padding: .45rem .45rem 1.05rem; border: 1px solid #b9a98e;
      background: #fffdf7; box-shadow: .1rem .2rem .4rem #49382226; transform: rotate(-3deg);
    }
    .plate img { display: block; width: 100%; height: auto; }
    .plate::before {
      content: ""; position: absolute; width: 35%; height: 1.2rem; top: -.55rem; left: 30%; transform: rotate(5deg);
      background: #e3a73be8; border: 1px solid #a8762d;
      clip-path: polygon(2% 0, 100% 3%, 98% 24%, 100% 45%, 98% 74%, 100% 97%, 0 100%, 2% 73%, 0 51%, 2% 28%);
    }
    .plate::after {
      content: ""; position: absolute; width: 28%; aspect-ratio: 98 / 179; right: -8%; bottom: -.9rem;
      background: url("../images/rosas-folhas.webp") center / contain no-repeat; transform: rotate(20deg);
    }
    .salute { grid-area: title; align-self: end; }
    h1 { font: 600 clamp(2.8rem, 5.5vw, 4.8rem)/1.02 var(--heading); letter-spacing: -.035em; margin: 0 0 1.2rem; }
    h1 i { color: var(--teal); font-style: normal; }
    .message { grid-area: verse; align-self: start; }
    .rule { display: flex; align-items: center; gap: .55rem; color: #a84827; font: 1.15rem Georgia, serif; }
    .rule::before { content: ""; width: 2.8rem; height: .28rem; background: var(--mustard); border-radius: 50% 35% 25% 44%; transform: rotate(-2deg); }
    .verse { margin: 1rem 0 0; }
    blockquote { font: 400 clamp(1.45rem, 2.5vw, 2rem)/1.35 Georgia, serif; margin: 0; text-wrap: pretty; }
    figcaption { margin-top: .85rem; color: var(--teal); font-weight: 800; }
    .sign { color: var(--soft); font-size: 1rem; font-style: italic; margin: 1.45rem 0 0; }
    aside { margin-top: 1.7rem; }
    .catalog { display: flex; align-items: center; gap: .85rem; color: var(--ink); text-decoration: none; width: fit-content; max-width: 100%; border-radius: .5rem; }
    .catalog img { width: 3.35rem; height: 3.35rem; object-fit: cover; border: 1px solid var(--ink); border-radius: .55rem; }
    .catalog small { display: block; color: var(--soft); font-size: .91rem; }
    .catalog strong { color: var(--teal); text-decoration: underline; text-underline-offset: .18em; }
    .catalog:hover strong { color: #94401c; }
    .catalog:focus-visible { outline: 3px solid var(--teal); outline-offset: 5px; }
    @media (max-width: 42rem) {
      .wrap { width: min(31rem, calc(100% - 2rem)); }
      .scene {
        padding: 3.7rem 0 3.5rem;
        background-size: 10rem auto, 5.8rem auto, 3.3rem auto, auto;
      }
      .letter {
        grid-template-columns: minmax(0, 1fr) 31%;
        grid-template-areas: "title rose" "verse verse";
        gap: 1.4rem 1rem;
        padding: 1.65rem clamp(1.05rem, 5vw, 1.7rem);
      }
      .salute { align-self: center; }
      h1 { margin: 0; font-size: clamp(2.05rem, 8.4vw, 3.4rem); }
      .plate { padding: .2rem .2rem .45rem; }
      .plate::before { height: .65rem; top: -.32rem; }
      .plate::after { bottom: -.45rem; }
      .sign { margin-top: 1rem; }
      aside { margin: 1.4rem 0 0 1.6rem; }
    }
  </style>
</head>
<body>
  <header class="mast">
    <div class="wrap mast-inner">
      <span class="brand"><img src="../favicon-48x48.png" width="28" height="28" alt=""><span>NOLLIE<em>3D</em></span></span>
      <span class="origin">Orla de Santos</span>
    </div>
  </header>
  <div class="scene">
  <div class="wrap">
    <main class="letter">
      <div class="salute"><h1>Uma rosa<br><i>para vocês.</i></h1></div>
      <!-- Rosa Centifolia Anglica Rubra, Les Roses. Cleveland Museum of Art, CC0.
           https://www.clevelandart.org/art/1943.137 -->
      <figure class="plate" aria-hidden="true"><img src="../images/rosa-botanica.jpg" width="590" height="776" alt=""></figure>
      <div class="message">
        <div class="rule" aria-hidden="true">♡</div>
        <figure class="verse">
          <blockquote id="verse">Favo de mel são as palavras suaves, doces para a alma, e saúde para os ossos.</blockquote>
          <figcaption id="reference">Provérbios 16,24</figcaption>
        </figure>
        <p class="sign">Com carinho, da Nollie para vocês.</p>
      </div>
    </main>
    <aside aria-label="Catálogo da Nollie">
      <a class="catalog" href="../index.html#modelos">
        <img src="../images/croche/rosa-croche.jpg" width="64" height="64" alt="Rosa do catálogo da Nollie">
        <span><small>Outras criações de quem fez o seu chaveiro</small><strong>Conhecer a Nollie</strong></span>
      </a>
    </aside>
  </div>
  </div>
  <script>
    // Trechos de Provérbios, Almeida (1911), com grafia atualizada.
    const verses = [
      ["16,24", "Favo de mel são as palavras suaves, doces para a alma, e saúde para os ossos."],
      ["17,17", "Em todo o tempo ama o amigo."],
      ["4,23", "Sobre tudo o que se deve guardar, guarda o teu coração, porque dele procedem as saídas da vida."],
      ["15,1", "A resposta branda desvia o furor."],
      ["15,13", "O coração alegre aformoseia o rosto."],
      ["12,25", "A solicitude no coração do homem o abate, mas uma boa palavra o alegra."],
      ["17,22", "O coração alegre serve de bom remédio."],
      ["24,3", "Com a sabedoria se edifica a casa, e com a inteligência se estabelece."],
      ["11,25", "O que regar, ele também será regado."],
      ["25,11", "Como maçãs de ouro em salvas de prata, assim é a palavra dita a seu tempo."],
      ["3,17", "Os caminhos dela são caminhos de delícias, e todas as suas veredas paz."],
      ["15,23", "A palavra a seu tempo quão boa é!"]
    ];
    const storageKey = "nollie.rosas.visitas.v1";
    let lastShown = null;

    function readPrevious() {
      for (const type of ["localStorage", "sessionStorage"]) {
        try {
          const saved = window[type].getItem(storageKey);
          if (saved !== null) return saved;
        } catch { /* Storage may be unavailable in a private webview. */ }
      }
      return lastShown;
    }

    function showVerse() {
      const previous = readPrevious();
      const available = verses.filter(([reference]) => reference !== previous && reference !== lastShown);
      const [reference, text] = available[Math.floor(Math.random() * available.length)];
      lastShown = reference;
      document.getElementById("verse").textContent = text;
      document.getElementById("reference").textContent = "Provérbios " + reference;
      for (const type of ["localStorage", "sessionStorage"]) {
        try { window[type].setItem(storageKey, reference); } catch { /* Keep the verse readable. */ }
      }
    }

    showVerse();
    window.addEventListener("pageshow", event => { if (event.persisted) showVerse(); });
  </script>
</body>
</html>
