    const storageKey = "nollie.rosas.visitas.v1";
    let recent = { cycle: [], lastQuestion: {} };
    let onScreen = null;

    function readHistory() {
      for (const type of ["localStorage", "sessionStorage"]) {
        try {
          const raw = window[type].getItem(storageKey);
          if (!raw) continue;
          const saved = verses.some(([ref]) => ref === raw) ? [raw] : JSON.parse(raw);
          // Nas visitas antigas, cada provérbio tinha só a primeira pergunta.
          if (Array.isArray(saved)) {
            const cycle = saved.filter(ref => verses.some(([known]) => known === ref));
            return { cycle, lastQuestion: Object.fromEntries(cycle.map(ref => [ref, 0])) };
          }
          if (Array.isArray(saved?.cycle)) {
            return { cycle: saved.cycle, lastQuestion: saved.lastQuestion || {} };
          }
        } catch { /* Tenta o próximo armazenamento. */ }
      }
      return recent;
    }

    function showVerse() {
      const history = readHistory();
      let cycle = history.cycle;
      const previous = cycle[cycle.length - 1];
      let unread = verses.filter(([ref]) => !cycle.includes(ref));
      if (!unread.length) {
        cycle = [];
        unread = verses.filter(([ref]) => ref !== previous);
      }
      const different = unread.filter(([ref]) => ref !== onScreen);
      const choices = different.length ? different : unread;
      const [reference, text, questions] = choices[Math.floor(Math.random() * choices.length)];
      const last = history.lastQuestion[reference];
      const index = Number.isInteger(last) && last >= 0 && last < questions.length
        ? (last + 1) % questions.length
        : Math.floor(Math.random() * questions.length);
      document.getElementById("verse").textContent = text;
      document.getElementById("reference").textContent = "Provérbios " + reference;
      document.getElementById("question").textContent = questions[index];
      onScreen = reference;
      recent = {
        cycle: [...cycle, reference],
        lastQuestion: { ...history.lastQuestion, [reference]: index }
      };
      for (const type of ["localStorage", "sessionStorage"]) {
        try { window[type].setItem(storageKey, JSON.stringify(recent)); } catch { /* A leitura funciona em memória. */ }
      }
    }

    showVerse();
    window.addEventListener("pageshow", event => { if (event.persisted) showVerse(); });
